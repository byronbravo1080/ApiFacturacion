openapi: 3.0.3
info:
  title: FacturaEC API
  version: 0.2.0
  description: |
    API REST de FacturaEC, sistema de facturación electrónica para pequeñas empresas de Ecuador
    (Módulo 8 · Maestría en Ingeniería en Software · UPEC).

    Contrato API-first (ADR-005): es la fuente de verdad de la que se generan la documentación,
    el servidor mock y los stubs. Cada operación indica la historia (HU) y el escenario de calidad (E)
    que la originan. Las tarifas de IVA y el formato de la clave de acceso deben contrastarse con la
    ficha técnica vigente del SRI antes de pasar a producción.
  contact:
    name: Equipo FacturaEC (Byron Bravo, Jairo Jácome, Jordan Montenegro, Luis Cisneros)
    url: https://github.com/byronbravo1080/ApiFacturacion
  license:
    name: Uso académico
    url: https://github.com/byronbravo1080/ApiFacturacion
servers:
  - url: http://localhost:8000
    description: Servidor local de desarrollo (también el mock de Prism en el puerto 4010)
tags:
  - name: Sistema
    description: Verificación de estado del servicio.
  - name: Auth
    description: Registro del emisor y obtención del token (HU1).
  - name: Clientes
    description: Clientes de cada emisor, aislados por emisor (HU2, E1).
  - name: Productos
    description: Productos con su precio y tarifa de IVA (HU3).
  - name: Facturas
    description: Emisión, numeración y envío al SRI (HU4 a HU7, E2, E6).
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Sistema]
      operationId: verificarEstado
      summary: Verificar el estado del servicio
      description: Usado por la plataforma de despliegue para reiniciar la API si no responde (riesgo 11.2 del dossier). No requiere token.
      security: []
      responses:
        "200":
          description: El servicio está activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
        "503":
          description: El servicio no puede atender solicitudes.
  /api/v1/auth/registro:
    post:
      tags: [Auth]
      operationId: registrarEmisor
      summary: Registrar un emisor
      description: Crea el emisor y su usuario administrador y devuelve un token de acceso (HU1). No requiere token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroEmisor"
      responses:
        "201":
          description: Emisor registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "409":
          $ref: "#/components/responses/RucRegistrado"
        "422":
          $ref: "#/components/responses/DatosInvalidos"
  /api/v1/clientes:
    post:
      tags: [Clientes]
      operationId: registrarCliente
      summary: Registrar un cliente
      description: Registra un cliente del emisor autenticado (HU2, E1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteNuevo"
      responses:
        "201":
          description: Cliente registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "422":
          $ref: "#/components/responses/DatosInvalidos"
  /api/v1/clientes/{clienteId}:
    get:
      tags: [Clientes]
      operationId: obtenerCliente
      summary: Consultar un cliente
      description: Devuelve un cliente del emisor autenticado. Responde 404 si no existe o pertenece a otro emisor, sin revelar cuál de los dos casos ocurre (E1).
      parameters:
        - $ref: "#/components/parameters/ClienteId"
      responses:
        "200":
          description: Datos del cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/v1/productos:
    post:
      tags: [Productos]
      operationId: registrarProducto
      summary: Registrar un producto
      description: Registra un producto con su precio unitario y su tarifa de IVA (HU3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoNuevo"
      responses:
        "201":
          description: Producto registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "422":
          $ref: "#/components/responses/DatosInvalidos"
  /api/v1/facturas:
    post:
      tags: [Facturas]
      operationId: crearFactura
      summary: Crear una factura
      description: |
        Calcula subtotal, IVA y total; asigna el siguiente secuencial del emisor bajo bloqueo de fila
        y genera la clave de acceso de 49 dígitos (HU4, HU5, E6). La factura queda en estado CREADA.
        Responde 404 si el cliente o algún producto no existen o pertenecen a otro emisor (E1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacturaNueva"
      responses:
        "201":
          description: Factura creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Factura"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/DatosInvalidos"
  /api/v1/facturas/{facturaId}:
    get:
      tags: [Facturas]
      operationId: obtenerFactura
      summary: Consultar una factura y su estado
      description: Devuelve la factura, su estado de autorización y el total de intentos de envío (HU7). Responde 404 si es de otro emisor (E1).
      parameters:
        - $ref: "#/components/parameters/FacturaId"
      responses:
        "200":
          description: Datos de la factura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Factura"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
  /api/v1/facturas/{facturaId}/enviar-sri:
    post:
      tags: [Facturas]
      operationId: enviarFacturaSri
      summary: Enviar una factura al SRI
      description: |
        Envía la factura al SRI mediante el adaptador SriGateway (HU6, E2). Política de reintentos:
        hasta 3 intentos por solicitud, con esperas de 1 s y 2 s, y una respuesta en 60 s o menos.
        Si el SRI no responde, la factura se conserva en estado PENDIENTE y se responde 202.
        Solo se envían facturas CREADAS o PENDIENTES; una factura AUTORIZADA responde 409 para evitar
        una doble autorización (riesgo 11.2 del dossier). El tiempo máximo de 15 s por intento (E8)
        queda para una versión posterior.
      parameters:
        - $ref: "#/components/parameters/FacturaId"
      responses:
        "200":
          description: Factura autorizada por el SRI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoEnvio"
        "202":
          description: El SRI no respondió tras 3 intentos; la factura queda PENDIENTE para reenviarla después.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoEnvio"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          $ref: "#/components/responses/FacturaAutorizada"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ClienteId:
      name: clienteId
      in: path
      required: true
      description: Identificador del cliente.
      schema:
        type: integer
        minimum: 1
    FacturaId:
      name: facturaId
      in: path
      required: true
      description: Identificador de la factura.
      schema:
        type: integer
        minimum: 1
  responses:
    NoAutenticado:
      description: Falta el token o no es válido (E1).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            codigo: NO_AUTENTICADO
            mensaje: Falta el token o no es válido.
    NoEncontrado:
      description: El recurso no existe o pertenece a otro emisor; no se revela cuál de los dos casos ocurre (E1).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            codigo: NO_ENCONTRADO
            mensaje: Recurso no encontrado.
    RucRegistrado:
      description: El RUC ya está registrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            codigo: CONFLICTO
            mensaje: El RUC ya está registrado.
    FacturaAutorizada:
      description: La factura ya está autorizada; no se reenvía para evitar una doble autorización (riesgo 11.2 del dossier).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            codigo: CONFLICTO
            mensaje: La factura ya está autorizada.
    DatosInvalidos:
      description: Los datos de entrada no cumplen el contrato.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorValidacion"
          example:
            codigo: VALIDACION
            mensaje: Los datos de entrada no cumplen el contrato.
            detalles:
              - campo: nombre del campo con error
                mensaje: descripción del error de validación
  schemas:
    Monto:
      type: string
      description: Valor monetario en dólares con dos decimales.
      pattern: "^[0-9]{1,10}\\.[0-9]{2}$"
      example: "11.50"
    EstadoFactura:
      type: string
      enum: [CREADA, PENDIENTE, AUTORIZADA]
      description: CREADA (aún no enviada), PENDIENTE (el SRI no respondió) o AUTORIZADA.
    Estado:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          example: ok
    RegistroEmisor:
      type: object
      required: [ruc, razonSocial, clave]
      properties:
        ruc:
          type: string
          description: RUC de 13 dígitos terminado en 001.
          pattern: "^[0-9]{10}001$"
          example: "9990000001001"
        razonSocial:
          type: string
          minLength: 1
          maxLength: 300
        clave:
          type: string
          format: password
          writeOnly: true
          minLength: 8
    Token:
      type: object
      required: [accessToken, tokenType, emisorId]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [bearer]
        emisorId:
          type: integer
    ClienteNuevo:
      type: object
      required: [tipoIdentificacion, identificacion, razonSocial]
      properties:
        tipoIdentificacion:
          type: string
          enum: [CEDULA, RUC, PASAPORTE]
        identificacion:
          type: string
          minLength: 3
          maxLength: 20
        razonSocial:
          type: string
          minLength: 1
          maxLength: 300
        direccion:
          type: string
          maxLength: 300
    Cliente:
      allOf:
        - $ref: "#/components/schemas/ClienteNuevo"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              readOnly: true
    ProductoNuevo:
      type: object
      required: [codigo, descripcion, precioUnitario, tarifaIva]
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 25
        descripcion:
          type: string
          minLength: 1
          maxLength: 300
        precioUnitario:
          $ref: "#/components/schemas/Monto"
        tarifaIva:
          type: integer
          description: Porcentaje de IVA. Verificar las tarifas vigentes en la ficha técnica del SRI.
          enum: [0, 5, 15]
    Producto:
      allOf:
        - $ref: "#/components/schemas/ProductoNuevo"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              readOnly: true
    DetalleNuevo:
      type: object
      required: [productoId, cantidad]
      properties:
        productoId:
          type: integer
          minimum: 1
        cantidad:
          type: integer
          minimum: 1
          maximum: 100000
    FacturaNueva:
      type: object
      required: [clienteId, detalles]
      properties:
        clienteId:
          type: integer
          minimum: 1
        detalles:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/DetalleNuevo"
    Detalle:
      type: object
      required: [productoId, descripcion, cantidad, precioUnitario, tarifaIva, subtotal, iva]
      properties:
        productoId:
          type: integer
        descripcion:
          type: string
        cantidad:
          type: integer
        precioUnitario:
          $ref: "#/components/schemas/Monto"
        tarifaIva:
          type: integer
        subtotal:
          $ref: "#/components/schemas/Monto"
        iva:
          $ref: "#/components/schemas/Monto"
    Factura:
      type: object
      example:
        id: 1
        numero: "001-001-000000001"
        claveAcceso: "2310202601999000000100110010010000000011234567811"
        fechaEmision: "2026-10-23"
        clienteId: 1
        estado: CREADA
        subtotal: "10.00"
        iva: "1.50"
        total: "11.50"
        intentosEnvio: 0
        detalles:
          - productoId: 1
            descripcion: Producto ficticio
            cantidad: 1
            precioUnitario: "10.00"
            tarifaIva: 15
            subtotal: "10.00"
            iva: "1.50"
      required: [id, numero, claveAcceso, fechaEmision, clienteId, estado, subtotal, iva, total, intentosEnvio, detalles]
      properties:
        id:
          type: integer
          readOnly: true
        numero:
          type: string
          description: Establecimiento, punto de emisión y secuencial.
          pattern: "^[0-9]{3}-[0-9]{3}-[0-9]{9}$"
          example: "001-001-000000001"
        claveAcceso:
          type: string
          description: Clave de acceso de 49 dígitos con dígito verificador módulo 11.
          pattern: "^[0-9]{49}$"
          example: "2310202601999000000100110010010000000011234567811"
        fechaEmision:
          type: string
          format: date
        clienteId:
          type: integer
        estado:
          $ref: "#/components/schemas/EstadoFactura"
        subtotal:
          $ref: "#/components/schemas/Monto"
        iva:
          $ref: "#/components/schemas/Monto"
        total:
          $ref: "#/components/schemas/Monto"
        intentosEnvio:
          type: integer
          description: Total acumulado de intentos de envío al SRI.
        detalles:
          type: array
          items:
            $ref: "#/components/schemas/Detalle"
    ResultadoEnvio:
      type: object
      example:
        facturaId: 1
        estado: AUTORIZADA
        intentosEnEsteEnvio: 1
        mensaje: Factura autorizada por el SRI.
        numeroAutorizacion: "2310202601999000000100110010010000000011234567811"
      required: [facturaId, estado, intentosEnEsteEnvio, mensaje]
      properties:
        facturaId:
          type: integer
        estado:
          $ref: "#/components/schemas/EstadoFactura"
        intentosEnEsteEnvio:
          type: integer
          description: Intentos hechos en esta solicitud (1 a 3). El total acumulado está en Factura.intentosEnvio.
          minimum: 1
          maximum: 3
        mensaje:
          type: string
        numeroAutorizacion:
          type: string
          nullable: true
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          example: NO_ENCONTRADO
        mensaje:
          type: string
    ErrorValidacion:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [detalles]
          properties:
            detalles:
              type: array
              items:
                type: object
                required: [campo, mensaje]
                properties:
                  campo:
                    type: string
                  mensaje:
                    type: string
