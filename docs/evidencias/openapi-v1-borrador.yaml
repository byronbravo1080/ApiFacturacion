openapi: 3.0.3
info:
  title: FacturaEC API
  version: 0.2.0
  description: |
    API REST de FacturaEC, sistema de facturación electrónica para pequeñas empresas de Ecuador.
    Contrato API-first: es la fuente de verdad de la que se generan la documentación, el mock y los stubs.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Verificación de estado
      responses:
        "200":
          description: El servicio está activo.
  /api/v1/auth/registro:
    post:
      tags: [Auth]
      operationId: registrarEmisor
      summary: Registrar un emisor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroEmisor"
      responses:
        "201":
          description: Emisor registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "409":
          description: El RUC ya está registrado.
  /api/v1/clientes:
    post:
      tags: [Clientes]
      operationId: registrarCliente
      summary: Registrar un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteNuevo"
      responses:
        "201":
          description: Cliente registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
  /api/v1/clientes/{clienteId}:
    get:
      tags: [Clientes]
      operationId: obtenerCliente
      summary: Consultar un cliente
      parameters:
        - name: clienteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Datos del cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "404":
          description: El cliente no existe.
  /api/v1/productos:
    post:
      tags: [Productos]
      operationId: registrarProducto
      summary: Registrar un producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoNuevo"
      responses:
        "201":
          description: Producto registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
  /api/v1/facturas:
    post:
      tags: [Facturas]
      operationId: crearFactura
      summary: Crear una factura
      description: Calcula subtotal, IVA y total, asigna el secuencial y genera la clave de acceso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacturaNueva"
      responses:
        "201":
          description: Factura creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Factura"
  /api/v1/facturas/{facturaId}:
    get:
      tags: [Facturas]
      operationId: obtenerFactura
      summary: Consultar una factura y su estado
      parameters:
        - name: facturaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Datos de la factura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Factura"
        "404":
          description: La factura no existe.
  /api/v1/facturas/{facturaId}/enviar-sri:
    post:
      tags: [Facturas]
      operationId: enviarFacturaSri
      summary: Enviar una factura al SRI
      parameters:
        - name: facturaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Factura autorizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoEnvio"
        "202":
          description: El SRI no respondió; la factura queda PENDIENTE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoEnvio"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistroEmisor:
      type: object
      required: [ruc, razonSocial, clave]
      properties:
        ruc:
          type: string
          pattern: "^[0-9]{10}001$"
        razonSocial:
          type: string
        clave:
          type: string
          minLength: 8
    Token:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        emisorId:
          type: integer
    ClienteNuevo:
      type: object
      required: [tipoIdentificacion, identificacion, razonSocial]
      properties:
        tipoIdentificacion:
          type: string
          enum: [CEDULA, RUC, PASAPORTE]
        identificacion:
          type: string
        razonSocial:
          type: string
        direccion:
          type: string
    Cliente:
      allOf:
        - $ref: "#/components/schemas/ClienteNuevo"
        - type: object
          properties:
            id:
              type: integer
    ProductoNuevo:
      type: object
      required: [codigo, descripcion, precioUnitario, tarifaIva]
      properties:
        codigo:
          type: string
        descripcion:
          type: string
        precioUnitario:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        tarifaIva:
          type: integer
          enum: [0, 5, 15]
    Producto:
      allOf:
        - $ref: "#/components/schemas/ProductoNuevo"
        - type: object
          properties:
            id:
              type: integer
    FacturaNueva:
      type: object
      required: [clienteId, detalles]
      properties:
        clienteId:
          type: integer
        detalles:
          type: array
          minItems: 1
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId:
                type: integer
              cantidad:
                type: integer
                minimum: 1
    Factura:
      type: object
      properties:
        id:
          type: integer
        numero:
          type: string
          example: 001-001-000000001
        claveAcceso:
          type: string
        fechaEmision:
          type: string
          format: date
        clienteId:
          type: integer
        estado:
          type: string
          enum: [CREADA, PENDIENTE, AUTORIZADA]
        subtotal:
          type: string
        iva:
          type: string
        total:
          type: string
        intentosEnvio:
          type: integer
    ResultadoEnvio:
      type: object
      properties:
        facturaId:
          type: integer
        estado:
          type: string
        intentos:
          type: integer
        mensaje:
          type: string
security:
  - bearerAuth: []
