[metadata]
name = facturaec_stubs
version = 1.0.0
description = API REST de FacturaEC, sistema de facturación electrónica para pequeñas empresas de Ecuador (Módulo 8 · Maestría en Ingeniería en Software · UPEC).  Contrato API-first (ADR-005): es la fuente de verdad de la que se generan la documentación, el servidor mock y los stubs. Cada operación indica la historia (HU) y el escenario de calidad (E) que la originan. Las tarifas de IVA y el formato de la clave de acceso deben contrastarse con la ficha técnica vigente del SRI antes de pasar a producción. 
long_description = file: README.md
keywords = OpenAPI FacturaEC API
python_requires = >= 3.10.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10

[options]
install_requires = fastapi[all]
setup_requires = setuptools
package_dir = =src
packages = find_namespace:

[options.packages.find]
where = src
